<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        nav{
            background-color: #2cbab4;
            border-radius: 35px;
        }
    
        .navbar ul{
            overflow: auto;
        }
        .navbar li{
            float: left;
            list-style: none;
            margin: 15px 60px;
        }
        .navbar li a{
            padding: 3px 3px;
            text-decoration: none;
            color: white;
        }
        #searchid{
            border-radius: 30px;
            float: right;
            margin: 12px 30px;
        }
        .navbar li a:hover{
            color: rgb(32, 22, 22);
            background-color: rgb(227, 222, 108);
            border-radius: 30px;
        }
        
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li> <a href="#">Home</a></li>
                <li> <a href="#">About</a> </li>
                <li> <a href="#">Service</a></li>
                <li> <a href="#">Contact Us</a></li>
                <input type="text" name="search" id="searchid" placeholder="search">         
            </ul>
        </nav>
    </header>
</body>
</html>
