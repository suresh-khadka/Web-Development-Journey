<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height width order and Background</title>
    <style>
        #one{
            background-color: red;
            height: 100px;
            width: 120px;
            /* border-color: blue;
            border-style: solid;
            border-width: 4px; */
            border: 2px solid green;
            border-radius: 8px;
        }

        #two{
            background-color: green;
            height: 100px;
            width: 445px;
            border-top: 2px solid black;
            border-top-left-radius: 8px;
        }

        #thrd{
            color: white;
            height: 410px;
            width: 455 px;
            background-image: url(https://www.adobe.com/uk/creativecloud/photography/discover/media_13e5fec089c80f95e1e526a4ae454f0b7d8cc2414.png?width=2000&format=webply&optimize=medium);
            background-repeat: no-repeat; 
            /* background-position: top; */
            /* background-position: center left; */
            background-position: top left;
        }
    </style>
</head>
<body>
    <h3> this is heading</h3>
    <p id="one">this is paragraph</p>
    
    <p id="two">this is paragraph</p>

    <p id="thrd">this is paragraph</p>
    
</body>
</html>
