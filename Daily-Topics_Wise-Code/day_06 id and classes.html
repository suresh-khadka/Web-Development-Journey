<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes</title>
</head>
<body>
    <h3> ID and Classes tutorial</h3>
    <div id="mainbox" class="redbg">
        This is purple
    </div>
    <span class="hello"></span> 
    <!-- span.class_name is for class -->
     <span id="sures"></span>
     <!-- span#id_name is for ID -->
      <span class="myclass myroll my_name"></span>
      <!-- for more class  tag.n_class_name-->
       <span class="myclass myroll myname"></span>
       <span class="myclass myroll myname"></span>
       <span class="myclass myroll myname"></span>
       <span class="myclass myroll myname"></span>
       <!-- for more than one tag span.classname........*n -->
</body>
</html>
