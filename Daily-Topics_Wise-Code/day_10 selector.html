<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector</title>
    <style>
        /* 1. element selector */
        p{   
            color: red;
        }
        /* id selector */
        #id_name{ 
            color: black;
        }
        /* 2. class selector */
        .class_name{
            color: yellow;
        }
        /* 3. this is group selector */
        footer,span{
            color: rgb(11, 191, 11);
        }
    </style>
</head>
<body>
    <h3> CSS Selector</h3>
    <p class="class_name"> this paragraph demonstrate CSS selector </p>
    <p id="id_name"> this  another paragraph demonstrate CSS selector </p>
    <div>
        <p> this demonstrate the paragraph inside <strong> div</strong> tag </p>
    </div>
    <span> this is span</span>
    <footer> this is footer </footer>
</body>
</html>
