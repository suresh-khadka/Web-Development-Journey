<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility and Z index</title>
    <style>
        .box{
            border: 2px solid red;
            width: 170px;
            height: 170px;
        }
        #box1{
            background-color: aqua;
            top:49px;
            position: relative;
            z-index: 1;
        }
        #box2{
            background-color: rgb(156, 125, 219);
            position: relative;
            top: 14px;
            z-index: -1;
            /* visibility: hidden; */ 
            /* display: none; */
        }
        #box3{background-color: rgb(113, 25, 43);}
        #box4{background-color: rgb(25, 165, 93);}
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
