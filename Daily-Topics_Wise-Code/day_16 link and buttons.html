<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Selectors and More Design</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: aquamarine;
            padding: 34px;
            margin: 34px;
            width: 666px;
        }
        .btn{
            background-color: black;
            color: white;
            padding: 2px;
            margin: 2px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        a{
            text-decoration: none;
        }
        a:hover{
            color: red;
            background-color: yellow;
        }
        a:visited{
            color:green;
        }
        
    </style>
</head>
<body>
    <div id="one" class="container">
        <h3> This is my heading</h3>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Neque nemo fuga fugiat totam accusantium perspiciatis! Aliquam dolores, cum laboriosam voluptates velit possimus cumque in voluptatem? Dolore animi ullam nihil a.</p>
        <a href="https://www.google.com/" class="btn">read more</a>
        <button class="btn"> Contact Us</button>
    </div>
</body>
</html>
