<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list and table</title>
</head>
<body>
    <ul type="square">
        <li>what is your name </li>
        <li> i am a data engineer</li>
        <li> i am a fast lerner</li>
    </ul>
    <!-- this is unordered list -->
     <ol type="i">
        <li>this is ordered list</li>
        <li> i am a man</li>
        <ul>
            <li> this is nested list</li>
        </ul>
        <li> this is my bro??</li>
     </ol>
     <!-- this is ordered list -->

     <!-- table -->
      <h3> Table</h3>
      <table>
        <thead>
            <tr>
                <th> S.N </th>
                <th> Name</th>
                <th> Adress</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> 1 </td>
                <td> Suresh Khadka </td>
                <td> Chaumala</td>
            </tr>
            <tr>
                <td> 2</td>
                <td> tilak khadka </td>
                <td> kathmandu </td>
            </tr>
        </tbody>
      </table>
</body>
</html>
