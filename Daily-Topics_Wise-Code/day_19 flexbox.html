<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox tutorial</title>
    <style>
        .container{
            height: 344px;
            width:100%;
            border: 2px solid red;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            /* justify-content: center; */
            /* justify-content: space-around; */

        }
        .item{
            border: 2px solid black;
            background-color: yellow;
            margin: 9px;
            padding: 3px;
            height: 200px;
            width: 200px;
        }
        #item-1{
            order:4;
            flex-grow: 2;
        }
        #item-2{
            order:2;
            flex-grow: 3;
        }
        #item-3{
            order:9;
        }
    </style>
</head>
<body>
    <h1> This is flex box tutoria</h1>
    <div class="container">
        <div class="item" id="item-1">first-item</div>
        <div class="item" id="item-2">second-item</div>
        <div class="item" id="item-3">third-item</div>
        <!-- <div class="item" id="item-4">fourth-item</div> -->
        <!-- <div class="item" id="item-5">fifth-item</div> -->
        <!-- <div class="item" id="item-6">sixth-item</div> -->
    </div>
</body>
</html>
