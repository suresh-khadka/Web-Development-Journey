<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string functions</title>
</head>
<body>
    


    <script>
        var str= "this is a string"
        console.log(str)
        var pos=str.indexOf('is')
        console.log(pos)
        // slicing
        var substr=str.slice(1,7)
        // ans is (his is)
        console.log(substr)
        var substring=str.substr(1,7)
        console.log(substring)
    </script>
</body>
</html>
