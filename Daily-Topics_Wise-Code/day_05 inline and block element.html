<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Inline and block Element </title>
</head>
<body>
    <p style="border: 2px solid red;"> this is paragraph(block element) </p>
    <!-- this is a block element  -->
     <span style="border: 2px solid red;"> this is a span(inline element) </span>
     <br> <br>
     <li style="border: 2px solid red;"> this is li(block)</li>
     <ul style="border: 2px solid red;">what is this (ul) ? block or inline</ul>
</body>
</html>
